version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: gamestore-mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:latest
    container_name: gamestore-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gamestore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"